services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/oee-monitoring
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:4000
    depends_on: [mongodb, redis]
volumes:
  mongo-data: